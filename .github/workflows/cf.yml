name: Build and Release Cloudflared

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build:
    name: Build for ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux,   arch: amd64,  goos: linux,   goarch: amd64 }
          - { os: linux,   arch: arm64,  goos: linux,   goarch: arm64 }
          - { os: linux,   arch: armv6,  goos: linux,   goarch: arm,  goarm: 6 }
          - { os: darwin,  arch: amd64,  goos: darwin,  goarch: amd64 }
          - { os: darwin,  arch: arm64,  goos: darwin,  goarch: arm64 }
          - { os: windows, arch: amd64,  goos: windows, goarch: amd64 }

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Get dependencies
        run: go mod download

      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi
          echo "BUILD_TIME=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT
          echo "COMMIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: 0
        run: |
          PKG="github.com/cloudflare/cloudflared/cmd/cloudflared/updater"
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          BUILD_TIME="${{ steps.get_version.outputs.BUILD_TIME }}"
          COMMIT="${{ steps.get_version.outputs.COMMIT_SHA }}"

          EXT=""
          [ "${{ matrix.goos }}" = "windows" ] && EXT=".exe"
          OUTPUT_NAME="cloudflared-${{ matrix.os }}-${{ matrix.arch }}${EXT}"

          go build -v -trimpath \
            -ldflags="-s -w \
              -X '${PKG}.Version=${VERSION}' \
              -X '${PKG}.BuildTime=${BUILD_TIME}' \
              -X '${PKG}.Commit=${COMMIT}'" \
            -o "${OUTPUT_NAME}" \
            ./cmd/cloudflared

          echo "ASSET_NAME=${OUTPUT_NAME}" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudflared-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ env.ASSET_NAME }}
          retention-days: 5

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "${VERSION}" || true
            git push origin "${VERSION}" || true
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release_assets
          find ./artifacts -type f \( -name "cloudflared-*" \) -exec cp {} release_assets/ \;
          ls -lh release_assets/

      - name: Generate checksums
        working-directory: release_assets
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: Release ${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: false
          body: |
            ## Cloudflared Custom Build ${{ steps.get_version.outputs.VERSION }}

            ### 🚀 Changes
            - 新增 `TUN_PR` 环境变量，支持通过 SOCKS5 代理连接 Cloudflare Edge

            ### 📦 Downloads

            | 文件 | 平台 |
            |------|------|
            | `cloudflared-linux-amd64` | Linux x86_64 |
            | `cloudflared-linux-arm64` | Linux ARM64 |
            | `cloudflared-linux-armv6` | Linux ARMv6（树莓派等） |
            | `cloudflared-darwin-amd64` | macOS Intel |
            | `cloudflared-darwin-arm64` | macOS Apple Silicon |
            | `cloudflared-windows-amd64.exe` | Windows x86_64 |

            ### 📖 Usage

            **Linux / macOS**
```bash
            chmod +x cloudflared-linux-amd64

            # 无认证代理
            export TUN_PR=127.0.0.1:1080

            # 有认证代理
            export TUN_PR=user:pass@127.0.0.1:1080

            ./cloudflared-linux-amd64 tunnel run my-tunnel
```

            **Windows (PowerShell)**
```powershell
            # 无认证代理
            $env:TUN_PR = "127.0.0.1:1080"

            # 有认证代理
            $env:TUN_PR = "user:pass@127.0.0.1:1080"

            .\cloudflared-windows-amd64.exe tunnel run my-tunnel
```

            ### 🔐 Checksums
```bash
            sha256sum -c SHA256SUMS
```

            ### 🔗 Links
            - [官方文档](https://developers.cloudflare.com/cloudflare-one/connections/connect-apps/)
            - [原版仓库](https://github.com/cloudflare/cloudflared)
          files: release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
